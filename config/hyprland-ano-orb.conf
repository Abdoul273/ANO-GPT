# Bulle compagnon d'ANO-GPT — règles Hyprland
#
# À ajouter une fois dans ~/.config/hypr/hyprland.conf :
#
#   source = ~/OUTILS/ANO-GPT/config/hyprland-ano-orb.conf
#
# Pourquoi ce fichier : sous Wayland, une fenêtre ne choisit ni sa position ni
# son rang d'affichage — `move()` et « toujours au-dessus » y sont sans effet.
# C'est le compositeur qui décide, donc c'est ici que ça se règle.
#
# Pourquoi le titre plutôt que la classe : toutes les fenêtres Qt de
# l'application partagent le même `app_id` (`jarvis-dashboard`). Une règle
# `class:` attraperait aussi la fenêtre principale. Le titre « ANO Orb » est
# fixé en dur dans `CompanionOrb.WINDOW_TITLE` : il ne bouge pas.

windowrulev2 = float,        title:^(ANO Orb)$
windowrulev2 = pin,          title:^(ANO Orb)$
windowrulev2 = noborder,     title:^(ANO Orb)$
windowrulev2 = noshadow,     title:^(ANO Orb)$
windowrulev2 = noblur,       title:^(ANO Orb)$
windowrulev2 = nofocus,      title:^(ANO Orb)$
windowrulev2 = noanim,       title:^(ANO Orb)$

# Coin bas-droit, à 24 px des bords. La fenêtre garde une taille fixe de
# 348 × 120 (l'orbe à droite, la place de la bulle à sa gauche) : c'est le
# masque qui rend visible et cliquable la seule partie utile, donc la position
# n'a jamais besoin de bouger.
windowrulev2 = move 100%-372 100%-144, title:^(ANO Orb)$

# `pin` est ce qui fait suivre le bureau courant : une fenêtre flottante
# épinglée reste affichée quel que soit le workspace affiché. La bulle
# apparaît donc là où tu es, sans rien avoir à déplacer.

# ── ANO Visual Pointer (Overlay plein écran transparent non-bloquant) ────────
windowrulev2 = float,        title:^(ANO Visual Pointer.*)$
windowrulev2 = pin,          title:^(ANO Visual Pointer.*)$
windowrulev2 = noborder,     title:^(ANO Visual Pointer.*)$
windowrulev2 = noshadow,     title:^(ANO Visual Pointer.*)$
windowrulev2 = noblur,       title:^(ANO Visual Pointer.*)$
windowrulev2 = nofocus,      title:^(ANO Visual Pointer.*)$
windowrulev2 = noanim,       title:^(ANO Visual Pointer.*)$

