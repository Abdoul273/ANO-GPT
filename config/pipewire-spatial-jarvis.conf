# ═══════════════════════════════════════════════════════════════════════════
# ANO-GPT — PipeWire Filter-Chain : Spatialisation Binaurale HRTF pour Jarvis
# ═══════════════════════════════════════════════════════════════════════════
#
# Ce fichier configure un sink virtuel haute performance avec convolution HRTF
# native via libpipewire-module-filter-chain.
#
# Utilisation :
#   1. Lancer manuellement :
#        pipewire -c /home/anonymous/OUTILS/ANO-GPT/config/pipewire-spatial-jarvis.conf
#   2. Ou placer dans ~/.config/pipewire/pipewire.conf.d/
#

context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "ANO-GPT Jarvis 3D Spatial Audio"
            media.name       = "ANO-GPT Jarvis 3D Spatial Audio"
            filter.graph = {
                nodes = [
                    # Entrée mono répliquée
                    {
                        type  = builtin
                        label = copy
                        name  = copyIn
                    }
                    # Convolution Oreille Gauche
                    {
                        type  = builtin
                        label = convolver
                        name  = convLeft
                        config = {
                            filename = "/home/anonymous/OUTILS/ANO-GPT/config/jarvis_spatial_hrir.wav"
                            channel  = 0
                        }
                    }
                    # Convolution Oreille Droite
                    {
                        type  = builtin
                        label = convolver
                        name  = convRight
                        config = {
                            filename = "/home/anonymous/OUTILS/ANO-GPT/config/jarvis_spatial_hrir.wav"
                            channel  = 1
                        }
                    }
                ]
                links = [
                    { output = "copyIn:Out"    input = "convLeft:In" }
                    { output = "copyIn:Out"    input = "convRight:In" }
                ]
                inputs  = [ "copyIn:In" ]
                outputs = [ "convLeft:Out" "convRight:Out" ]
            }
            capture.props = {
                node.name      = "anogpt_spatial_sink"
                media.class    = Audio/Sink
                audio.channels = 1
                audio.position = [ MONO ]
            }
            playback.props = {
                node.name      = "anogpt_spatial_sink.output"
                node.passive   = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
